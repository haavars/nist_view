# Builds the desktop bundles for every target (docs/ci.md).
#
# Not signed with a certificate (decided 2026-10-01): macOS builds are signed
# ad hoc, which Apple Silicon requires to run at all, and Windows builds are
# unsigned.
name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # Temporary, while the workflow is being made to work (docs/ci.md, step 2).
    branches: [ci]

env:
  MIX_ENV: prod
  # Matches the tauri crate in src-tauri/Cargo.lock.
  TAURI_CLI_VERSION: "2.12.1"
  # Ad-hoc signing, for ElixirKit's release step and for Tauri.
  APPLE_SIGNING_IDENTITY: "-"

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: windows-2022
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Read versions
        id: versions
        shell: bash
        run: echo "rust=$(awk '$1 == "rust" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      # setup-beam does not recognise the arm64 Ubuntu image's ImageOS
      # (erlef/setup-beam#462); strip the suffix around it, as Livebook does.
      - name: Normalise ImageOS
        shell: bash
        run: |
          echo "ORIGINAL_IMAGE_OS=$ImageOS" >> "$GITHUB_ENV"
          echo "ImageOS=${ImageOS%-arm64}" >> "$GITHUB_ENV"

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore ImageOS
        if: always()
        shell: bash
        run: echo "ImageOS=$ORIGINAL_IMAGE_OS" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            native/nist_codecs
            native/nist_decode
          cache-directories: ~/.cargo/bin
          key: ${{ matrix.target }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - name: Install Tauri CLI
        shell: bash
        run: |
          if [ "$(cargo tauri --version 2>/dev/null)" != "tauri-cli $TAURI_CLI_VERSION" ]; then
            cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked --force
          fi

      - name: Fetch Elixir dependencies
        run: mix deps.get --only prod

      - name: Install asset tools
        run: mix assets.setup

      # The standalone Tailwind binary's ad-hoc signature does not survive
      # download on recent macOS (it is killed on launch).
      - name: Re-sign Tailwind (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - _build/tailwind-*

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tauriScript: cargo tauri
          args: --target ${{ matrix.target }}

      # The release the bundle carries: its Erlang runtime, the codecs NIF
      # and the nist_decode helper, on this platform (docs/ci.md, step 3).
      - name: Smoke test the release
        shell: bash
        run: |
          bin=src-tauri/target/rel/bin/nist_view
          if [ "$RUNNER_OS" = Windows ]; then bin=$bin.bat; fi
          "$bin" eval 'Code.eval_file("scripts/release_smoke.exs")'

      - uses: actions/upload-artifact@v4
        with:
          name: nist-viewer-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
