# hayro-jpeg2000 0.4.0 as published on crates.io, with the changes listed in
# PATCHES.md. The manifest is the published one without its example,
# benchmarks and development dependencies.

[package]
edition = "2024"
rust-version = "1.92"
name = "hayro-jpeg2000"
version = "0.4.0"
authors = ["Laurenz Stampfl <laurenz.stampfl@gmail.com>"]
description = "A memory-safe, pure-Rust JPEG 2000 decoder."
readme = "README.md"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/LaurenzV/hayro"
publish = false

[features]
default = ["std", "simd", "image"]
image = ["dep:image", "dep:moxcms", "std"]
logging = ["dep:log"]
simd = ["fearless_simd", "std"]
std = []

[lib]
name = "hayro_jpeg2000"
path = "src/lib.rs"

[dependencies.fearless_simd]
version = "0.4.0"
optional = true

[dependencies.image]
version = "0.25"
optional = true
default-features = false

[dependencies.log]
version = "0.4"
optional = true

[dependencies.moxcms]
version = "0.8.1"
optional = true
