[package]
name = "nist_codecs"
version = "0.1.0"
edition = "2021"

[lib]
name = "nist_codecs"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.37"
png = "0.18"

[build-dependencies]
cc = "1"

# Rust 1.85 strips release dylibs in a way the macOS 27 loader rejects
# ("mis-aligned LINKEDIT string pool"). Revisit after a toolchain upgrade.
[profile.release]
strip = false
