[package]
name = "nist_codecs"
version = "0.1.0"
edition = "2021"

[lib]
name = "nist_codecs"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
rustler = { version = "0.38", optional = true }
png = "0.18"
# A patched copy (native/hayro-jpeg2000/PATCHES.md). Without its default
# features it has no SIMD and no dependencies, and then no unsafe code.
hayro-jpeg2000 = { path = "../hayro-jpeg2000", default-features = false }

[features]
default = ["nif"]
# The Elixir interface. Off for the fuzz targets, which use the decoders
# directly (see fuzz/).
nif = ["dep:rustler"]


[lints.rust]
# cargo-fuzz builds with `--cfg fuzzing` (see MAX_PIXELS).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
