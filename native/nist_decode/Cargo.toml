[package]
name = "nist_decode"
version = "0.1.0"
edition = "2021"
description = "Decodes images for NistView outside the BEAM (see NistView.Decoder)"

[[bin]]
name = "nist_decode"
path = "src/main.rs"

[dependencies]
nist_codecs = { path = "../nist_codecs", default-features = false }

[profile.release]
# A panic in a decoder ends this process at once; NistView.Decoder reports it.
panic = "abort"
